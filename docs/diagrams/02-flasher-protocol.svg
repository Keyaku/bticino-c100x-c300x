<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="t d">
  <title id="t">Flasher protocol</title>
  <desc id="d">USB RNDIS link carrying OpenWebNet WHO 13 plus FTP. Read-only preflight, status decides the path, main-system write, FTP upload, POSIX CRC checksum, reboot. Safety gates: dry-run by default, allow-write flag, verified backup receipt.</desc>
  <style>
    .bg{fill:#0f1720}
    .box{fill:#1b2a3a;stroke:#4aa3ff;stroke-width:2}
    .go{fill:#132235;stroke:#3fb950;stroke-width:2}
    .warn{fill:#2a2113;stroke:#d29922;stroke-width:2}
    .stop{fill:#2a1517;stroke:#f85149;stroke-width:2}
    .t{fill:#e6edf3;font-family:sans-serif;font-size:15px;text-anchor:middle}
    .s{fill:#8b98a5;font-family:sans-serif;font-size:12px;text-anchor:middle}
    .code{fill:#9fe0b0;font-family:monospace;font-size:13px;text-anchor:middle}
    .ln{stroke:#8b98a5;stroke-width:2;fill:none;marker-end:url(#a)}
    .cap{fill:#cdd7e0;font-family:sans-serif;font-size:13px;text-anchor:middle}
    .h{fill:#e6edf3;font-family:sans-serif;font-size:14px;font-weight:bold;text-anchor:middle}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b98a5"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="960" height="560"/>

  <rect class="box" x="300" y="20" width="360" height="56" rx="8"/>
  <text class="h" x="480" y="44">PC  &#8596;  device link</text>
  <text class="s" x="480" y="64">USB / RNDIS (usb0 192.168.129.1/30) &#183; OpenWebNet WHO=13 + FTP</text>

  <rect class="box" x="340" y="110" width="280" height="64" rx="8"/>
  <text class="t" x="480" y="135">Read-only preflight</text>
  <text class="code" x="480" y="158">*#13**40##  model/hw/fw/status</text>

  <rect class="box" x="360" y="210" width="240" height="48" rx="8"/>
  <text class="t" x="480" y="240">status decides</text>

  <rect class="go" x="70" y="300" width="250" height="70" rx="8"/>
  <text class="t" x="195" y="326">normal system</text>
  <text class="code" x="195" y="348">#36  (never invalidate kernel)</text>

  <rect class="warn" x="355" y="300" width="250" height="70" rx="8"/>
  <text class="t" x="480" y="326">recovery only if asked</text>
  <text class="code" x="480" y="348">#37  (--recovery)</text>

  <rect class="stop" x="640" y="300" width="250" height="70" rx="8"/>
  <text class="t" x="765" y="326">status 4</text>
  <text class="s" x="765" y="348">refused (not automated)</text>

  <rect class="box" x="120" y="410" width="300" height="56" rx="8"/>
  <text class="t" x="270" y="434">FTP upload image</text>
  <text class="s" x="270" y="454">opened only after #36/#37</text>

  <rect class="box" x="455" y="410" width="300" height="56" rx="8"/>
  <text class="t" x="605" y="434">verify + reboot</text>
  <text class="code" x="605" y="454">POSIX cksum CRC &#183; *#13**42## = writing</text>

  <rect class="stop" x="250" y="500" width="460" height="46" rx="8"/>
  <text class="t" x="480" y="522">Safety gates</text>
  <text class="s" x="480" y="540">dry-run by default &#183; --allow-write &#183; device-verified backup receipt (#31)</text>

  <path class="ln" d="M480,76 L480,108"/>
  <path class="ln" d="M480,174 L480,208"/>
  <path class="ln" d="M400,258 L250,298"/>
  <path class="ln" d="M480,258 L480,298"/>
  <path class="ln" d="M560,258 L720,298"/>
  <path class="ln" d="M195,370 L250,408"/>
  <path class="ln" d="M480,370 L560,408"/>
  <path class="ln" d="M270,466 L420,498"/>
  <path class="ln" d="M605,466 L540,498"/>
</svg>
